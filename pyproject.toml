[project]
name = "fluorosuite"
version = "0.1.0"
description = "Unified fluoroscopy suite for capture, playback, and aneurysm and inlet ROI analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyqtgraph>=0.13",
    "pyside6>=6.7,<6.10",
]

[project.scripts]
fluorosuite = "fluorosuite.app:main"
fluorosuite-export = "fluorosuite.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fluorosuite"]
